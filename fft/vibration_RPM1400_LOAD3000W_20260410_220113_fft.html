    const selectedPoints = [];

    }

        const nextData = [baseData[0]];

    function toggleSelectedPoint(x, y) {
        const key = pointKey(x, y);

        if (existingIndex >= 0) {
            selectedPoints.splice(existingIndex, 1);
            rebuildPlot();
            return;
        }

        selectedPoints.push({ x: Number(x), y: Number(y), key });
        rebuildPlot();
    }
